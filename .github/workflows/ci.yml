name: ci

# Gate workflow: tree-sitter generate + corpus tests + parse all examples +
# benchmark + per-binding (Node / Rust / Python / Go / C#) build & test, fanned
# out over every grammar in the repo.
#
# Matrix shape: {grammar} x {language} x {os}. The set of grammars is the single
# source of truth in .github/grammars.json; the `discover` job publishes it and
# every downstream job expands over it. Add a dialect by appending one entry to
# that file (e.g. {"name":"beckhoff","path":"grammars/beckhoff"}); the whole
# matrix grows automatically, no edits to this file.
#
# Branch protection on `main` should require only the `ci-success` aggregate
# check, so matrix changes never break the required-checks list.
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Discover grammars — single source of truth for the {grammar} dimension.
  # ────────────────────────────────────────────────────────────────────────
  discover:
    name: discover grammars
    runs-on: ubuntu-latest
    outputs:
      grammars: ${{ steps.set.outputs.grammars }}
    steps:
      - uses: actions/checkout@v6
      - id: set
        shell: bash
        run: echo "grammars=$(jq -c . .github/grammars.json)" >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────────────────
  # Grammar — corpus + examples + benchmark, per grammar. Linux only because
  # the grammar is platform-independent and tree-sitter's CLI is fastest there.
  # ────────────────────────────────────────────────────────────────────────
  grammar:
    name: grammar (${{ matrix.grammar.name }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grammar: ${{ fromJSON(needs.discover.outputs.grammars) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22" }

      - name: Install tree-sitter-cli
        run: npm install -g tree-sitter-cli

      - name: Verify generated parser is up to date
        working-directory: ${{ matrix.grammar.path }}
        run: |
          tree-sitter generate
          if [[ -n "$(git status --porcelain src/)" ]]; then
            echo "::error::src/ is out of date for grammar '${{ matrix.grammar.name }}'. Run 'tree-sitter generate' and commit."
            git --no-pager diff src/
            exit 1
          fi

      - name: Run corpus tests
        working-directory: ${{ matrix.grammar.path }}
        run: tree-sitter test

      - name: Parse every example file
        working-directory: ${{ matrix.grammar.path }}
        run: |
          set -euo pipefail
          fails=0
          for f in examples/*.st; do
            if tree-sitter parse "$f" --quiet; then
              echo "OK   $f"
            else
              echo "FAIL $f"
              fails=$((fails + 1))
            fi
          done
          if (( fails > 0 )); then
            echo "::error::$fails example(s) failed to parse"
            exit 1
          fi

      - name: Benchmark — parse 10 000 lines under 200 ms
        working-directory: ${{ matrix.grammar.path }}
        run: |
          # Construct a synthetic 10k-line file by repeating a representative
          # example, then time the parse.
          mkdir -p .benchmark
          for i in $(seq 1 200); do
            cat examples/pid-controller.st examples/conveyor.st examples/state-machine.st
          done > .benchmark/big.st
          lines=$(wc -l < .benchmark/big.st)
          echo "Benchmark file: $lines lines"
          start=$(date +%s%N)
          tree-sitter parse .benchmark/big.st --quiet
          end=$(date +%s%N)
          elapsed_ms=$(( (end - start) / 1000000 ))
          echo "Parse time: ${elapsed_ms} ms"
          if (( elapsed_ms > 200 )); then
            echo "::error::Parse exceeded 200 ms budget (${elapsed_ms} ms)"
            exit 1
          fi

  # ────────────────────────────────────────────────────────────────────────
  # Language bindings. Each {grammar} x {os} combination compiles the generated
  # parser and runs its smoke test, operating inside the grammar's directory.
  # ────────────────────────────────────────────────────────────────────────

  node:
    name: node (${{ matrix.grammar.name }}, ${{ matrix.os }})
    needs: [discover, grammar]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        grammar: ${{ fromJSON(needs.discover.outputs.grammars) }}
        # windows-2022: npm install builds the node-tree-sitter dev dependency
        # with node-gyp, whose VS finder cannot classify the VS 18 that
        # windows-latest now ships. windows-2022 still provides VS 2022.
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: npm install
        working-directory: ${{ matrix.grammar.path }}
      - run: npm test
        working-directory: ${{ matrix.grammar.path }}

  rust:
    name: rust (${{ matrix.grammar.name }}, ${{ matrix.os }})
    needs: [discover, grammar]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        grammar: ${{ fromJSON(needs.discover.outputs.grammars) }}
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.grammar.path }}
      - run: cargo test --all-features
        working-directory: ${{ matrix.grammar.path }}

  python:
    name: python (${{ matrix.grammar.name }}, ${{ matrix.os }})
    needs: [discover, grammar]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        grammar: ${{ fromJSON(needs.discover.outputs.grammars) }}
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: "pip" }
      - run: python -m pip install --upgrade pip build
      - run: pip install -e ".[core]"
        working-directory: ${{ matrix.grammar.path }}
      - run: python -c "import tree_sitter, tree_sitter_iec61131_3_st; lang = tree_sitter.Language(tree_sitter_iec61131_3_st.language()); print('Loaded:', lang)"
        working-directory: ${{ matrix.grammar.path }}

  go:
    name: go (${{ matrix.grammar.name }}, ${{ matrix.os }})
    needs: [discover, grammar]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        grammar: ${{ fromJSON(needs.discover.outputs.grammars) }}
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: { go-version: "1.23.x" }
      - run: go test ./bindings/go/...
        working-directory: ${{ matrix.grammar.path }}

  csharp:
    name: c# (${{ matrix.grammar.name }}, ${{ matrix.os }})
    needs: [discover, grammar]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        grammar: ${{ fromJSON(needs.discover.outputs.grammars) }}
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "8.x" }

      - name: Setup MSVC env (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native library (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ matrix.grammar.path }}
        run: make

      - name: Build native library (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ matrix.grammar.path }}
        run: |
          cl /std:c11 /utf-8 /LD /I src src/parser.c src/scanner.c /Fe:tree-sitter-iec61131-3-st.dll
        shell: cmd

      - name: Run C# tests (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ matrix.grammar.path }}
        run: dotnet test bindings/c_sharp/TreeSitterIec61131_3St.Tests/
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ matrix.grammar.path }}
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/${{ matrix.grammar.path }}

      - name: Run C# tests (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ matrix.grammar.path }}
        shell: pwsh
        run: |
          $env:PATH = "$PWD;$env:PATH"
          dotnet test bindings/c_sharp/TreeSitterIec61131_3St.Tests/

  # ────────────────────────────────────────────────────────────────────────
  # WASM — build each grammar to WebAssembly and load it through web-tree-sitter,
  # exercising the path downstream consumers use without the native build.
  # ────────────────────────────────────────────────────────────────────────
  wasm:
    name: wasm (${{ matrix.grammar.name }})
    needs: [discover, grammar]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grammar: ${{ fromJSON(needs.discover.outputs.grammars) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - uses: mymindstorm/setup-emsdk@v16
      - name: Install tree-sitter-cli
        run: npm install -g tree-sitter-cli
      - name: Build WASM grammar
        working-directory: ${{ matrix.grammar.path }}
        run: tree-sitter build --wasm -o grammar.wasm .
      - name: Install web-tree-sitter
        run: npm install --ignore-scripts
      - name: Parse every example via web-tree-sitter
        run: node scripts/wasm-smoke.mjs ${{ matrix.grammar.path }}

  # ────────────────────────────────────────────────────────────────────────
  # Aggregate gate — the single required check for branch protection. Succeeds
  # only if every matrix job above succeeded; fails if any failed or was
  # cancelled. Keeps the required-checks list stable as the matrix grows.
  # ────────────────────────────────────────────────────────────────────────
  ci-success:
    name: ci-success
    needs: [discover, grammar, node, rust, python, go, csharp, wasm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::one or more required CI jobs did not pass"
            exit 1
          fi
          echo "All required CI jobs passed."
